<text x="26" y="54" fill="#7d8a96">synthetic signal, real algorithm from oceanshield_esp32.ino</text>
<text x="26" y="278" fill="#7d8a96" xml:space="preserve"><tspan fill="#f2cc60">◯</tspan> R-peak   <tspan fill="#39d0ff">▮</tspan> 300 ms refractory   <tspan fill="#f2cc60">- -</tspan> adaptive threshold   ·   ~500 Hz sampling   ·   electrodes off → 0 BPM</text>
