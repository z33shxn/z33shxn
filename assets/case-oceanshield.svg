<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="900" height="414" role="img" aria-label="OceanShield investigation log: the pipeline was fine, the sensors read 0 V, and two of three alarm rules could never fire">
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}

  text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}
  .cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
</style>
<rect x=".5" y=".5" width="899" height="413" rx="14" fill="#0b1117" stroke="#1f2b38"/>
<path d="M.5 40H899.5" stroke="#1f2b38"/>
<rect x=".5" y=".5" width="899" height="39.5" rx="14" fill="#0d141c"/>
<rect x=".5" y="20" width="899" height="20" fill="#0d141c"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="450.0" y="24.5" text-anchor="middle" fill="#7d8a96" style="font-size:12.5px">case-file-01  ·  oceanshield  ·  the sensor that read zero</text>
<text x="26" y="72" xml:space="preserve" opacity="0"><tspan fill="#7d8a96"># symptom: months of "no data" on the dashboard</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0294;0.0412;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="96" xml:space="preserve" opacity="0"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">suspect #1: the WiFi, or ThingSpeak</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0794;0.0912;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="120" xml:space="preserve" opacity="0"><tspan fill="#3fb950">  ✔ </tspan><tspan fill="#c9d1d9">uploads arrive on a steady ~30 s cadence. the pipeline is fine.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1294;0.1412;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="144" xml:space="preserve" opacity="0"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">python analysis/oceanshield_log_analyzer.py</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1794;0.1912;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="168" xml:space="preserve" opacity="0"><tspan fill="#f2cc60">  991 records</tspan><tspan fill="#c9d1d9"> · the sensors are reading </tspan><tspan fill="#ff6b6b">0 V</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2294;0.2412;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="192" xml:space="preserve" opacity="0"><tspan fill="#c9d1d9">  r(MEMS, ECG) = </tspan><tspan fill="#f2cc60">+0.9992</tspan><tspan fill="#7d8a96">   ← two "independent" sensors, one signal</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2794;0.2912;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="216" xml:space="preserve" opacity="0"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">grep -n "/ 4" firmware/original_sketch/original_sketch.ino</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3294;0.3412;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="240" xml:space="preserve" opacity="0"><tspan fill="#c9d1d9">  memsValue = analogRead(memsPin) / 4;</tspan><tspan fill="#7d8a96">   ← 12-bit ADC, small readings floored to 0</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3794;0.3912;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="264" xml:space="preserve" opacity="0"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">replay the dashboard's alarm rules over the whole history</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4294;0.4412;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="288" xml:space="preserve" opacity="0"><tspan fill="#ff6b6b">  ✘ </tspan><tspan fill="#c9d1d9">mean(MEMS) &gt; 2000</tspan><tspan fill="#7d8a96">   never true: the firmware maxed out at 1023</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4794;0.4912;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="312" xml:space="preserve" opacity="0"><tspan fill="#ff6b6b">  ✘ </tspan><tspan fill="#c9d1d9">any(water &gt; 1)</tspan><tspan fill="#7d8a96">      never true: the input was a digital 0/1</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5294;0.5412;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="336" xml:space="preserve" opacity="0"><tspan fill="#ff6b6b">  ✘ </tspan><tspan fill="#c9d1d9">risk score 0</tspan><tspan fill="#7d8a96">        "nothing wrong" was displayed as </tspan><tspan fill="#ff6b6b">High Risk</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5794;0.5912;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="360" xml:space="preserve" opacity="0"><tspan fill="#3fb950">✔ root cause: wiring, firmware and dashboard logic. not the cloud.</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6294;0.6412;0.9529;1" dur="17.0s" repeatCount="indefinite"/></text><text x="26" y="384" fill="#3fb950">$ <tspan class="cur" fill="#e6edf3">▋</tspan></text>
</svg>