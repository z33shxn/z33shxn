<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="AirLock: encrypted packets flow from sender to receiver to dashboard; a replayed packet is rejected because its message ID was already seen">
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}

  text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:12px}
  .flow{stroke-dasharray:7 7;animation:flow 1s linear infinite} @keyframes flow{to{stroke-dashoffset:-14}}
  .key{stroke-dasharray:69.1;animation:key 2s linear infinite} @keyframes key{from{stroke-dashoffset:69.1}to{stroke-dashoffset:0}}
  .live{animation:pulse 1.4s ease-in-out infinite} @keyframes pulse{50%{opacity:.25}}
</style>
<rect x=".5" y=".5" width="899" height="379" rx="14" fill="#0b1117" stroke="#1f2b38"/>
<text x="26" y="36" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:700" fill="#e6edf3">Encrypted is not the same as safe</text>
<text x="26" y="58" fill="#7d8a96">AirLock design, from the project report · HackSymmetric runner-up</text>
