<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="1800" height="600" role="img" aria-label="Walk-forward validation: train on the past, test on the next unseen window, roll forward. The gap between in-sample and out-of-sample is overfitting."><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12202b"/></pattern><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} </style><rect x=".5" y=".5" width="899" height="299" rx="16" fill="#0b1117" stroke="#1f2b38"/><text class="s" x="26.0" y="36.0" font-size="17" font-weight="700" fill="#e6edf3">Walk-forward validation</text><path d="M120 68H640" stroke="#8b98a5" stroke-width="1"/><path d="M634 64L640 68L634 72" fill="none" stroke="#8b98a5"/><text class="m" x="640.0" y="60.0" text-anchor="end" font-size="11" fill="#8b98a5">time →</text><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0444;0.0778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="104.0" y="100.0" text-anchor="end" font-size="12" fill="#8b98a5">fold 1</text><rect x="120" y="86" width="208.0" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="331.0" y="86" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="393.4" y="86" width="246.6" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1444;0.1778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="104.0" y="134.0" text-anchor="end" font-size="12" fill="#8b98a5">fold 2</text><rect x="120" y="120" width="270.4" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="393.4" y="120" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="455.8" y="120" width="184.2" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2444;0.2778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="104.0" y="168.0" text-anchor="end" font-size="12" fill="#8b98a5">fold 3</text><rect x="120" y="154" width="332.8" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="455.8" y="154" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="518.2" y="154" width="121.8" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3444;0.3778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="104.0" y="202.0" text-anchor="end" font-size="12" fill="#8b98a5">fold 4</text><rect x="120" y="188" width="395.2" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="518.2" y="188" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="580.6" y="188" width="59.4" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4444;0.4778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="104.0" y="236.0" text-anchor="end" font-size="12" fill="#8b98a5">fold 5</text><rect x="120" y="222" width="457.6" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="580.6" y="222" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="643.0" y="222" width="0.0" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><text class="s" x="712.0" y="98.0" font-size="12.5" font-weight="600" fill="#e6edf3">what it catches</text><path d="M712 240H862" stroke="#1f2b38"/><rect x="720" y="120" width="50" height="120" rx="4" fill="#39d0ff" opacity="0.8"><animate attributeName="height" values="0.0;0.0;120.0;120.0;0.0" keyTimes="0.0000;0.5556;0.6222;0.9444;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="y" values="240.0;240.0;120.0;120.0;240.0" keyTimes="0.0000;0.5556;0.6222;0.9444;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/></rect><rect x="800" y="194" width="50" height="46" rx="4" fill="#f2cc60" opacity="1"><animate attributeName="height" values="0.0;0.0;46.0;46.0;0.0" keyTimes="0.0000;0.6222;0.6889;0.9444;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="y" values="240.0;240.0;194.0;194.0;240.0" keyTimes="0.0000;0.6222;0.6889;0.9444;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/></rect><text class="m" x="745.0" y="257.0" text-anchor="middle" font-size="11" fill="#39d0ff">in-sample</text><text class="m" x="825.0" y="257.0" text-anchor="middle" font-size="11" fill="#f2cc60">out-of-sample</text><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7000;0.7333;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><path d="M785.0 120V194" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="3 3"/><text class="m" x="780.0" y="153.0" font-size="11" fill="#ff6b6b">the gap</text><text class="m" x="780.0" y="169.0" font-size="11" fill="#ff6b6b">is overfitting</text></g><rect x="120" y="266" width="14" height="10" rx="2" fill="#39d0ff" opacity=".75"/><text class="m" x="140.0" y="275.0" font-size="11.5" fill="#8b98a5">train</text><rect x="200" y="266" width="14" height="10" rx="2" fill="#f2cc60"/><text class="m" x="220.0" y="275.0" font-size="11.5" fill="#8b98a5">test (never seen)</text><rect x="370" y="266" width="14" height="10" rx="2" fill="#3a4756"/><text class="m" x="390.0" y="275.0" font-size="11.5" fill="#8b98a5">future, untouched</text></svg>