<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Walk-forward validation: train on the past, test on the next unseen window, roll forward; the gap between in-sample and out-of-sample is overfitting."><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12202b"/></pattern><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} </style><rect x=".5" y=".5" width="899" height="299" rx="16" fill="#0b1117" stroke="#1f2b38"/><text class="s" x="26" y="36" font-size="17" font-weight="700" fill="#e6edf3">Walk-forward validation</text><path d="M120 68H640" stroke="#8b98a5" stroke-width="1"/><path d="M634 64L640 68L634 72" fill="none" stroke="#8b98a5"/><text class="m" x="640" y="60" text-anchor="end" font-size="11" fill="#8b98a5">time →</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0444;0.0778;0.9444;1" dur="9.0s" repeatCount="indefinite"/><text class="m" x="104" y="100" text-anchor="end" font-size="12" fill="#8b98a5">fold 1</text><rect x="120" y="86" width="208.0" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="331.0" y="86" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="393.4" y="86" width="246.6" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1444;0.1778;0.9444;1" dur="9.0s" repeatCount="indefinite"/><text class="m" x="104" y="134" text-anchor="end" font-size="12" fill="#8b98a5">fold 2</text><rect x="120" y="120" width="270.4" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="393.4" y="120" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="455.8" y="120" width="184.2" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2444;0.2778;0.9444;1" dur="9.0s" repeatCount="indefinite"/><text class="m" x="104" y="168" text-anchor="end" font-size="12" fill="#8b98a5">fold 3</text><rect x="120" y="154" width="332.8" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="455.8" y="154" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="518.2" y="154" width="121.8" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3444;0.3778;0.9444;1" dur="9.0s" repeatCount="indefinite"/><text class="m" x="104" y="202" text-anchor="end" font-size="12" fill="#8b98a5">fold 4</text><rect x="120" y="188" width="395.2" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="518.2" y="188" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="580.6" y="188" width="59.4" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4444;0.4778;0.9444;1" dur="9.0s" repeatCount="indefinite"/><text class="m" x="104" y="236" text-anchor="end" font-size="12" fill="#8b98a5">fold 5</text><rect x="120" y="222" width="457.6" height="20" rx="4" fill="#39d0ff" opacity=".75"/><rect x="580.6" y="222" width="59.4" height="20" rx="4" fill="#f2cc60"/><rect x="643.0" y="222" width="0.0" height="20" rx="4" fill="#3a4756" opacity=".5"/></g><text class="s" x="700" y="82" font-size="12.5" font-weight="600" fill="#e6edf3">what it catches</text><path d="M700 240H870" stroke="#1f2b38"/><rect x="720" y="240" width="50" height="0" rx="4" fill="#39d0ff" opacity=".8"><animate attributeName="height" values="0;0;120;120;0" keyTimes="0;0.5556;0.6222;0.9444;1" dur="9.0s" repeatCount="indefinite"/><animate attributeName="y" values="240;240;120;120;240" keyTimes="0;0.5556;0.6222;0.9444;1" dur="9.0s" repeatCount="indefinite"/></rect><rect x="800" y="240" width="50" height="0" rx="4" fill="#f2cc60"><animate attributeName="height" values="0;0;46;46;0" keyTimes="0;0.6222;0.6889;0.9444;1" dur="9.0s" repeatCount="indefinite"/><animate attributeName="y" values="240;240;194;194;240" keyTimes="0;0.6222;0.6889;0.9444;1" dur="9.0s" repeatCount="indefinite"/></rect><text class="m" x="745" y="258" text-anchor="middle" font-size="11" fill="#39d0ff">in-sample</text><text class="m" x="825" y="258" text-anchor="middle" font-size="11" fill="#f2cc60">out-of-sample</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7000;0.7333;0.9444;1" dur="9.0s" repeatCount="indefinite"/><path d="M775 120V194" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="3 3"/><text class="m" x="782" y="160" font-size="11" fill="#ff6b6b">the gap</text><text class="m" x="782" y="174" font-size="11" fill="#ff6b6b">is overfitting</text></g><rect x="120" y="266" width="14" height="10" rx="2" fill="#39d0ff" opacity=".75"/><text class="m" x="140" y="275" font-size="11.5" fill="#8b98a5">train</text><rect x="200" y="266" width="14" height="10" rx="2" fill="#f2cc60"/><text class="m" x="220" y="275" font-size="11.5" fill="#8b98a5">test (never seen)</text><rect x="370" y="266" width="14" height="10" rx="2" fill="#3a4756"/><text class="m" x="390" y="275" font-size="11.5" fill="#8b98a5">future, untouched</text></svg>