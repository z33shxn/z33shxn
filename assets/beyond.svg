<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="900" height="176" role="img" aria-label="Beyond code: Toastmasters contest chair, GCC Next Summit interviewer, Umagine volunteer; speaks English, Tamil, Hindi and Arabic."><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12202b"/></pattern><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .card{animation:up .7s ease-out both} @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style><rect x=".5" y=".5" width="899" height="175" rx="16" fill="#0b1117" stroke="#1f2b38"/><text class="s" x="26" y="36" font-size="17" font-weight="700" fill="#e6edf3">Beyond code</text><g class="card" style="animation-delay:0.00s"><rect x="22" y="58" width="201" height="100" rx="12" fill="#0f1720" stroke="#1f2b38"/><rect x="22" y="58" width="201" height="3" rx="1.5" fill="#f2cc60"/><text class="s" x="36" y="86" font-size="14" font-weight="700" fill="#f2cc60">Contest Chair</text><text class="s" x="36" y="108" font-size="12.5" fill="#e6edf3">Toastmasters Club at CIT</text><text class="m" x="36" y="128" font-size="10.5" fill="#8b98a5">ran the Humorous Speech and</text><text class="m" x="36" y="143" font-size="10.5" fill="#8b98a5">Evaluation Speech contests</text></g><g class="card" style="animation-delay:0.15s"><rect x="235" y="58" width="201" height="100" rx="12" fill="#0f1720" stroke="#1f2b38"/><rect x="235" y="58" width="201" height="3" rx="1.5" fill="#39d0ff"/><text class="s" x="249" y="86" font-size="14" font-weight="700" fill="#39d0ff">Interviewer</text><text class="s" x="249" y="10