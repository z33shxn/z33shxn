<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="800" height="1120" role="img" aria-label="Walk-forward validation: train on the past, test on the next unseen window, roll forward. The gap between in-sample and out-of-sample is overfitting."><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#12202b"/></pattern><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} </style><rect x=".5" y=".5" width="399" height="559" rx="16" fill="#0b1117" stroke="#1f2b38"/><text class="s" x="22.0" y="40.0" font-size="21" font-weight="700" fill="#e6edf3">Walk-forward validation</text><text class="m" x="22.0" y="66.0" font-size="14" fill="#8b98a5">train on the past, test the next window</text><path d="M86 104H378" stroke="#8b98a5" stroke-width="1"/><path d="M372 100L378 104L372 108" fill="none" stroke="#8b98a5"/><text class="m" x="378.0" y="95.0" text-anchor="end" font-size="13.5" fill="#8b98a5">time →</text><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0444;0.0778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="76.0" y="138.8" text-anchor="end" font-size="13.5" fill="#8b98a5">fold 1</text><rect x="86" y="122" width="116.8" height="24" rx="4" fill="#39d0ff" opacity=".75"/><rect x="205.8" y="122" width="32.0" height="24" rx="4" fill="#f2cc60"/><rect x="240.8" y="122" width="137.2" height="24" rx="4" fill="#3a4756" opacity=".5"/></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1444;0.1778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="76.0" y="176.8" text-anchor="end" font-size="13.5" fill="#8b98a5">fold 2</text><rect x="86" y="160" width="151.8" height="24" rx="4" fill="#39d0ff" opacity=".75"/><rect x="240.8" y="160" width="32.0" height="24" rx="4" fill="#f2cc60"/><rect x="275.9" y="160" width="102.1" height="24" rx="4" fill="#3a4756" opacity=".5"/></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2444;0.2778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="76.0" y="214.8" text-anchor="end" font-size="13.5" fill="#8b98a5">fold 3</text><rect x="86" y="198" width="186.9" height="24" rx="4" fill="#39d0ff" opacity=".75"/><rect x="275.9" y="198" width="32.0" height="24" rx="4" fill="#f2cc60"/><rect x="310.9" y="198" width="67.1" height="24" rx="4" fill="#3a4756" opacity=".5"/></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3444;0.3778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="76.0" y="252.8" text-anchor="end" font-size="13.5" fill="#8b98a5">fold 4</text><rect x="86" y="236" width="221.9" height="24" rx="4" fill="#39d0ff" opacity=".75"/><rect x="310.9" y="236" width="32.0" height="24" rx="4" fill="#f2cc60"/><rect x="346.0" y="236" width="32.0" height="24" rx="4" fill="#3a4756" opacity=".5"/></g><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4444;0.4778;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><text class="m" x="76.0" y="290.8" text-anchor="end" font-size="13.5" fill="#8b98a5">fold 5</text><rect x="86" y="274" width="257.0" height="24" rx="4" fill="#39d0ff" opacity=".75"/><rect x="346.0" y="274" width="32.0" height="24" rx="4" fill="#f2cc60"/><rect x="381.0" y="274" width="0.0" height="24" rx="4" fill="#3a4756" opacity=".5"/></g><rect x="22" y="319" width="15" height="12" rx="2" fill="#39d0ff" opacity=".75"/><text class="m" x="43.0" y="330.0" font-size="13.5" fill="#8b98a5">train</text><rect x="112" y="319" width="15" height="12" rx="2" fill="#f2cc60"/><text class="m" x="133.0" y="330.0" font-size="13.5" fill="#8b98a5">test, unseen</text><rect x="268" y="319" width="15" height="12" rx="2" fill="#3a4756"/><text class="m" x="289.0" y="330.0" font-size="13.5" fill="#8b98a5">future</text><path d="M22 356H378" stroke="#1f2b38"/><text class="s" x="52.0" y="374.0" font-size="16" font-weight="600" fill="#e6edf3">what it catches</text><path d="M52 506H262" stroke="#1f2b38"/><rect x="60" y="396" width="70" height="110" rx="4" fill="#39d0ff" opacity="0.8"><animate attributeName="height" values="0.0;0.0;110.0;110.0;0.0" keyTimes="0.0000;0.5556;0.6222;0.9444;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="y" values="506.0;506.0;396.0;396.0;506.0" keyTimes="0.0000;0.5556;0.6222;0.9444;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/></rect><rect x="180" y="464" width="70" height="42" rx="4" fill="#f2cc60" opacity="1"><animate attributeName="height" values="0.0;0.0;42.0;42.0;0.0" keyTimes="0.0000;0.6222;0.6889;0.9444;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><animate attributeName="y" values="506.0;506.0;464.0;464.0;506.0" keyTimes="0.0000;0.6222;0.6889;0.9444;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/></rect><text class="m" x="95.0" y="525.5" text-anchor="middle" font-size="13.5" fill="#39d0ff">in-sample</text><text class="m" x="215.0" y="525.5" text-anchor="middle" font-size="13.5" fill="#f2cc60">out-of-sample</text><g><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7000;0.7333;0.9444;0.9778;1.0000" dur="9.0s" calcMode="linear" repeatCount="indefinite"/><path d="M155.0 396V464" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="3 3"/><text class="m" x="262.0" y="426.0" font-size="14" fill="#ff6b6b">the gap</text><text class="m" x="262.0" y="445.0" font-size="14" fill="#ff6b6b">is overfitting</text></g></svg>